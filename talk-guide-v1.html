こで具体例を挟む","payload":["この動画自体も ／ 僕が毎回一対一で説明していた考え方を ／ 先に共通で渡すための実演でした","動画を見ただけでは ／ あなたの教室で何を残すべきかまでは僕には決められません","そこは ／ あなたの生徒が何にお金を払っているかを一番よく知っている人が決めること"],"fixed":["この動画自体も、僕が毎回一対一で説明していた考え方を、先に共通で渡すための実演でした","そこは、あなたの生徒が何にお金を払っているかを一番よく知っている人が決めることです"],"listener":"抽象論ではなく、実際の場面として分かる","nextQuestion":"ここで出てくる疑問を拾う"},{"id":539,"sectionIndex":77,"chapter":"PART5　自分で決められることと、外から見たほうがいいこと","section":"まとめ","sectionBeat":8,"type":"ask","cue":"聞き手の疑問を拾う","payload":["このチャンネルでは ／ これからも ／ 生徒が来てくれたあとの教え方と提供の設計を扱っていき","先生の時間だけを増やさずに ／ どうすれば生徒へ必要なものを渡せるのか","今日の話だけで終わらせず ／ 業種ごとの違いや ／ 実際に動かす時の判断まで掘り下げていくつもり"],"fixed":["先生の時間だけを増やさずに、どうすれば生徒へ必要なものを渡せるのか"],"listener":"自分の疑問が置き去りにされていない","nextQuestion":"もう一段だけ話を進める"},{"id":540,"sectionIndex":77,"chapter":"PART5　自分で決められることと、外から見たほうがいいこと","section":"まとめ","sectionBeat":9,"type":"say","cue":"ここを一段だけ進める","payload":["は今週一時間使った反復の中から ／ 説明を一つだけ ／ 次の生徒も使える形へ変えてみてください","戻った時間を ／ 新しい生徒 ／ 教材の改善 ／ 休む時間のどれに使うか ／ 自分で選べる状態に変えてください"],"fixed":["まずは今週一時間使った反復の中から、説明を一つだけ、次の生徒も使える形へ変えてみてください","そして戻った時間を、新しい生徒、教材の改善、休む時間のどれに使うか、自分で選べる状態に変えてください"],"listener":"自分の教室にも同じ上限があるかもしれない","nextQuestion":"もう一段だけ話を進める"},{"id":541,"sectionIndex":77,"chapter":"PART5　自分で決められることと、外から見たほうがいいこと","section":"まとめ","sectionBeat":10,"type":"say","cue":"ここを一段だけ進める","payload":["ここまで見ていただいて ／ ありがとうございました"],"fixed":[],"listener":"今の論点を一つ理解できる","nextQuestion":""}],sections=[{"title":"オープニング　予約は埋まっているのに、時間がない","raw":"予約表が埋まっているのは、本来ならうれしいことのはずです。でも、そのせいで新しい生徒を断っている。土日は昼から夜までレッスンで、この先はもう、枠を増やさない限り売上も増えそうにない。今日の動画は、そういう状態から抜けるために作りました。\n\n説明も、質問対応も、添削も、先生本人が全部やっている。生徒をあと五人受け入れたいのに、その五人を入れる時間がどこにもない。入れられなくはないけれど、入れたら自分の生活が壊れることが分かっている。すでに有料の生徒がいて、時間の上限に近づいている一人講師の方や、小規模な教室を運営している方が対象です。\n\n僕自身、講師を増やすことも、グループレッスンにすることも、値上げすることも考えました。でも、当時はどれも現実的に選べませんでした。それでも、予約枠を増やさずに、受け入れられる人数を増やす方法はありました。\n\nやったことを一言で言うと、毎週繰り返している説明のうち、誰に対しても同じ部分は教材と公開の場へ移して、自分は、その人にしかできない判断だけに残る、ということです。この動画では、その分け方と移し方を、実際にやった順番に沿って七つのステップで話します。特に、どこまでを共通にして、どこからを個別に残すのか。ここを曖昧にせず、自分の教室で決められるところまで進めます。\n\n今はまだ有料の生徒がいない方や、まず集客を何とかしたいという方には、少し先の話になると思います。今日は、生徒が来てくれたあとに、何をどう渡していくか。教え方の部分を六十分かけて話します。\n\n僕が教室運営の発信を見ていて感じるのは、生徒を集める話に比べて、生徒が来てくれたあとの教え方や、提供の組み方を扱う話がかなり少ないことです。でも、実際に予約が埋まった先生が次に困るのは、そこなんですよ。集客できたのに、受け入れる場所がない。売上を増やそうとすると、自分の休みがなくなる。僕は、この集客のあとに起きる問題を扱うために、このチャンネルを作りました。\n\n僕は、あまねといいます。\n\n先に僕自身の結果だけお伝えすると、今は約六十名が在籍していて、個別のフィードバックに使っている時間は週に二時間から三時間です。十数名の個別レッスンで土日が埋まっていたところから、どうやって今の形へ変えたのか。その中身を、今日は最初から順番に話します。\n\n今日話すことは、僕が音楽制作のオンライン教育をやってきた中で、実際に行き詰まって、実際に組み直した内容です。順番としては、まず今の教室のどこで時間が消えているかを数字で確認して、そのあと七つの手順で、教え方そのものを組み直していきます。"},{"title":"生徒が一人増えると、何が増えるのか","raw":"まず、今起きていることを整理させてください。\n\n一対一で教えていると、生徒が一人増えた時に増えるのは、レッスンの時間だけではありません。レッスンの前に、この人が前回どこまでやったかを確認する時間が増えます。レッスンのあと、記録を書いて、チャットで補足を返す時間が増えます。日程の変更連絡が来る回数も、当然一人分増えます。\n\nだから、一人増えるたびに、レッスン枠の六十分より多い時間が消えていきます。この形を続ける限り、どこかで必ず、予約枠か先生の稼働時間のどちらかが天井に当たります。集客がうまくいっている教室ほど、その天井に早くぶつかります。\n\nここでよく出てくる対策は、だいたい三つです。講師を増やす。グループレッスンにする。料金を上げる。どれも間違っていません。実際にこれで解決できている教室はたくさんあります。ただ、教えている内容や、今いる生徒との関係によっては、すぐには選べないこともあります。\n\n僕の場合が、まさにそれでした。"},{"title":"僕が行き詰まったときの話","raw":"当時、僕は十数名を一対一のオンライン個別レッスンで教えていました。土日が休みの方が多かったので、レッスンは週末に集中します。昼から夜まで枠を入れても足りず、入れなかった人は翌週へ振り替える。すると、その翌週の枠もまた埋まっていきます。\n\n新しく問い合わせが来ても、入れる場所がない。集客の前に、物理的に椅子がありませんでした。\n\nそれで、代わりに教えられる講師を探しました。ただ、まったくツテがなかったんです。音楽制作を教えられて、しかも僕と同じように一人ひとりの曲を見られる人が、知り合いに思い当たりませんでした。\n\n次に考えたのがグループレッスンです。二人か三人を同じ時間に見れば、単純に枠が二倍、三倍になります。ただ、僕が教えているのは、その人が作った曲を聴いて次に直す場所を決める、という内容です。レベルも目標も、目指している音楽のジャンルも全部違う人を同じ時間に並べて、片方に話している間、もう片方は待っている。それは僕の場合は無理だな、と思いました。\n\nレッスン時間を短くすることも考えましたし、一回あたりの料金を上げることも考えました。ただ、すでに通ってくれている生徒へ値上げを伝えることは、当時の僕にはできませんでした。\n\n打つ手が全部つぶれたので、最後に、六十分のレッスンの中で自分が何に時間を使っているのかを、一度分解してみることにしました。"},{"title":"分解して見えたこと","raw":"これが、今日の話の出発点です。\n\nレッスンの中で自分が何を話しているのかを整理していくと、はっきり二種類に分かれたんです。\n\n一つは、相手が誰であっても、まったく同じことを話している部分でした。制作ソフトの基本操作。作業を速くするショートカット。曲を最後まで形にするときの順番。ミキシングとマスタリングの基礎。コード進行の作り方。これを僕は、生徒が入会するたびに、その場で一人ずつ説明していました。十人いれば十回、二十人いれば二十回です。内容は毎回ほぼ同じでした。\n\nもう一つは、その人の曲を実際に聴かないと、絶対に決められない部分でした。この曲は、どこから直せば一番よくなるのか。今のこの人の段階で、次に手をつけるべきは音の配置なのか、コードなのか、それとも構成そのものなのか。これは録画では作れません。目の前にその人の音源がないと、僕には何も言えない。\n\n同じ六十分の中に、この二つが混ざって入っていた。そこに気づいたのが最初でした。\n\nで、この二つは、渡し方を別々にできます。毎回同じことを話している部分は、一度作って置いておけば、次の生徒にもそのまま使えます。動画にしてしまえば、僕がその場にいなくても、生徒は自分のタイミングで見られる。一方、その人の曲を聴かないと決められない部分は、僕が直接見るしかない。\n\nだったら、前者は全部教材と学習の順番へ移して、質問と回答はほかの生徒も見られる場所に残す。そして僕の時間は、その人の提出物を見て次の一手を決める部分だけに使う。この形へ変えました。"},{"title":"今の数字","raw":"結果として今は、約六十名が在籍していて、累計では七十名以上が受講登録をしています。\n\n週に届くフィードバックの依頼は、平均で六件ほどです。一件あたり二十分から三十分なので、個別のフィードバックに使っている時間は、週にだいたい二時間から三時間になります。もちろん教材の更新や、運営の作業や、こういう発信は別にあります。ただ、六十名全員に同じ長さの個別レッスンを配る形はやめられました。人数と、僕が個別に使う時間が、そのまま比例しない渡し方に変えられた、ということです。\n\n十数名で土日が埋まっていた頃より人数は増えていますが、個別に使う時間は減っています。共通の説明と、一人ひとりに必要な判断を、別の形で渡すようにしたからです。\n\nただ、この動画で持ち帰ってほしいのは、六十名という人数そのものではありません。大事なのは、自分の時間の使い道を選び直せることです。週末や夜をレッスンで埋め続けるのか、その一部を空けるのか。空いた時間で新しい生徒を受け入れるのか、教材を良くするのか、それとも休むのか。今のままだと予約表が決めてしまうことを、自分で選べる状態に変えていく。そのための手順を、ここから話します。\n\n最後まで見てもらえれば、少なくとも、自分の教室で最初に外へ出せる仕事を一つと、逆に自分が残るべき仕事を一つは決められるはずです。\n\nこれは僕が音楽教育でやった実例です。ほかの教室でもどこまで使えるのかは、実際に教室を運営している方へ話を聞きながら確かめています。今日は僕の例を材料にして、何をどう分け、どんな順番で形にしたのかを話します。"},{"title":"今日の範囲と、この先の流れ","raw":"教室の商売を大きく分けると、市場を決めること、商品を作ること、集客、販売、そして実際の提供があります。この中で今日は、何を売るのかと、それをどう渡すのか。「商品」と「提供」のところを進めます。\n\n流れとしては、まずPART1で、今の教室のどこに上限があるかを数字で出します。そのあとPART2で、七つのステップを順番に通していきます。直近一週間の繰り返し作業を書き出すところから始めて、共通の説明と個別の判断を分けて、最初の教材を一つ作る。教材、公開の質問場所、グループ、個別の役割を決めて、生徒が次に何をすればいいか分かる順番を作る。提供する期間と範囲を商品の形にして、今いる生徒を一気には移さず、最後に少人数で試して、続けるか、直すか、止めるかを判定する。ここまでです。\n\nそのあとPART3で、業種によって線引きがどう変わるかを話します。PART4で全体を一枚にまとめて、PART5で、やらないことをどう決めるかを話して終わります。\n\n全体を通して、架空の教室にも一緒に登場してもらいます。先生が一人、生徒が二十四人、レッスン以外の対応に週九時間かかっている教室です。これは実在の成功事例ではなくて、判断の仕方を具体的に見せるために作った仮の教室です。各ステップで、この先生が何をどう決めたかを追いかけます。\n\nそれから、動画の中で「書き出してください」と言う数字がいくつか出てきます。それは概要欄のLINEに置いてある診断シートでも整理できます。今すぐ取りに行かなくて大丈夫です。動画を見終わって、自分の教室に当てはめる段になってから使ってください。\n\nただ、手順に入る前に、一つだけ確認したいことがあります。今のやり方のままだと、自分の教室は最大で何人まで受け入れられて、売上はいくらまでなのか。ここを数字にします。上限が見えていないと、この先の七つのステップも、急いでやる理由が分かりません。逆に、上限がはっきりすると、毎週どの仕事から外へ出すべきかも見えやすくなります。PART1で、そこを先に出します。\n\n---"},{"title":"PART1　まず、どこで時間が消えているかを特定する","raw":"ここから少しだけ計算をします。電卓を出してもらってもいいですし、頭の中で追いかけてもらっても大丈夫です。数字はゆっくり読みます。\n\nなぜ最初に計算するのかというと、今ぶつかっている壁が、集客の壁なのか、教え方の壁なのかを、自分の数字ではっきりさせたいからです。ここが曖昧なまま教材を作り始めると、たいてい途中で止まります。何のために作っているのか分からなくなるからです。"},{"title":"今の売上が、何で決まっているか","raw":"個別レッスン型の教室の売上は、かなり雑に言うと、単価に予約枠を掛けたものです。一回一万円で、月に八十枠なら、八十万円。それだけです。\n\nこの式のまま売上を伸ばそうとすると、選べる手は限られます。単価を上げるか、枠を増やすか、別の先生を雇うか。だいたいこの三つです。どれも間違いではないんですけど、共通しているのは、一人の先生が一人の生徒へ自分の時間を渡す、という教え方そのものは何も変わっていない点です。\n\n予約枠が埋まっている状態というのは、今の教え方で受け入れられる限界に届いた状態でもあります。ここを取り違えると、集客はできている、生徒からも必要とされている、売上もゼロじゃない、それなのに時間だけがない、という状態が延々と続きます。"},{"title":"値上げしたのに、時間が減らない理由","raw":"ここでよくあるのが、じゃあ値上げしよう、という判断です。\n\n理屈の上では正しいです。単価を二倍にすれば、半分の人数で同じ売上になる。だから時間が空くはず。ところが、実際にはそうならないことがあります。\n\n何が起きるかというと、値段を上げた瞬間に、自分の中で責任の感じ方が変わるんです。月四万円もらっている人に対して、レッスンの合間の質問を放っておくのが気持ち悪くなる。チャットが来たら早く返したくなる。追加で資料を作りたくなる。ちょっと気になった箇所は、頼まれていなくても添削したくなる。\n\nその結果、単価は二倍になったのに、一人あたりに使う時間も一・五倍とか二倍になっていく。売上は増えたけれど、時間は空いていない。しかも、そこで下げるわけにもいかない。この状態はかなりしんどいです。\n\nだから、価格を触る前に確認したいのが、誰に、どのタイミングで、自分の時間を使っているのかという中身のほうです。\n\nついでに、言葉の整理もしておきます。教室の仕組み化というと、予約システムを入れるとか、決済を自動にするとか、そういう事務の話だと思われがちです。それも必要ではあるんですけど、今日話すのはそこじゃありません。予約の手配が一日五分から一分に減ったとしても、レッスン本体が全部一対一のままなら、根っこの問題は残ります。先生が毎回、同じ価値を自分の時間で手渡している。そこまで含めて組み直す話をします。"},{"title":"実際に、自分の上限を計算する","raw":"では、数字を出します。\n\n個別レッスン型なら、平均単価に、月に用意できる枠の数と、その枠がどのくらい埋まっているかを掛ければ出ます。\n\nたとえば、一回八千円。月に四十枠まで出せる。平均して八割が埋まっている。八割というのは〇・八なので、八千円かける四十枠かける〇・八。計算すると、月の売上は二十五万六千円です。\n\nもし四十枠が全部埋まったらどうなるか。八千円かける四十枠で、三十二万円です。\n\nこの計算で見てほしいのは、あと六万四千円伸ばせるという話より、その先です。四十枠より増やせないなら、この教え方でたどり着ける売上は三十二万円までです。そこから先へ進むには、値上げするか、枠を増やすか、人を増やすか。さっきの三択に戻ります。\n\nもし実際に、枠がなくて問い合わせを断っているなら、もう一つだけ計算してみてください。直近三か月で断った人数に、一人が最初の三か月で支払う金額を掛けます。問い合わせた方が全員入会するわけではないので、これは失った売上の確定額ではありません。ただ、今の教え方のままでは、検討することすらできなかった売上の候補がどのくらいあるのかは見えてきます。"},{"title":"見えていない時間を、時間に入れる","raw":"次に、予約表には出てこない時間も入れてみます。\n\n一回六十分のレッスンだとします。でも実際には、その前に前回の記録を読み返して、今日どこから始めるか考える時間が二十分ある。終わったあとに、レッスン記録を書いて、補足をチャットで送る時間が十五分ある。合計すると、この一回に使っている時間は九十五分です。\n\n売上は八千円。使った時間は九十五分、つまり一時間半と少し。八千円を九十五分で割って、六十分を掛けると、一時間あたりおよそ五千円になります。\n\nレッスン料の表示だけ見れば、一時間八千円の仕事に見えます。でも、準備と後始末まで全部入れて計算すると、一時間あたり五千円です。この差を知らないまま「一時間八千円もらえているから、あと二枠増やせば」と考えると、増やした瞬間に手が回らなくなります。"},{"title":"月謝型の場合","raw":"月謝型でも同じことをやります。\n\n月謝が一万二千円で、生徒が三十人なら、月商は三十六万円です。レッスンは月四回のグループで、同じ時間に十人ずつ見るとすると、一対一で回すより先生の時間はずっと短くて済みます。ここまでは、月謝型のほうが有利に見えます。\n\n問題は、そこに付いてくるものです。三十人全員に、月一回三十分の個別相談を付けたとします。三十人かける三十分で九百分。時間に直すと十五時間です。さらに、一人あたり月十分ぐらいのチャット対応があるとします。三十人分で三百分、つまり五時間。個別で対応する部分だけで、月に二十時間になりました。\n\nグループにしたから自動的に楽になる、ということはないんです。どこまで対応するかを決めないまま月謝の中に個別を入れると、料金は固定なのに、先生の作業時間だけが人数分きれいに増えていきます。"},{"title":"紙に四つ書く","raw":"ここで、紙かメモが開ける方は、四つだけ書いてください。\n\n平均単価。月に出せる最大の枠数。そのうち今どのくらい埋まっているか。そして、レッスン外まで含めて、一人に何分使っているか。\n\nこの四つが埋まると、今の教え方で月にいくらまで売れるのかと、実際に使っている時間に対して一時間あたりいくら稼いでいるのかが同時に見えます。だいたいの方は、二つ目の数字を見て少し驚くと思います。\n\nそれと、もう一つ確認してほしいことがあります。自分が一週間まるまる休んだ月、売上はいくら残るか。\n\n休んだ一週間分がそのまま売上から消えるなら、先生が止まると売上も止まる状態です。過去に作った教材とか、月額のサービスとか、別の担当者の対応で一部が残るなら、先生が動かなくても提供できている部分がそこにあります。売上の大きさだけでなく、休んだときに何割残るかも、今の教え方を測る数字になります。"},{"title":"教え方を変えるべきか、三つの質問で判定する","raw":"全員が講座を作るべきだとは思っていません。\n\n予約枠にまだ余裕がある。値上げしても続けてもらえる理由が明確にある。別の先生に任せても品質を保てる基準がある。このどれかで十分に伸ばせるなら、そっちを先にやったほうが早いです。手数も少ないです。\n\n一方で、枠はほぼ埋まっている。値上げしても自分の時間は減らない。ほかの先生にそのまま渡せる基準もない。そこへ毎週、同じ説明と、同じ質問と、同じ添削が積み上がっている。この状態なら、教え方そのものを組み直す意味があります。\n\n判定のために、三つ書いてください。\n\n一週間で、同じ説明を何回したか。質問と添削に、合計何時間使ったか。そしてその中で、相手を見ないと決められなかったものは何件あったか。\n\n三つ目が特に重要です。ここが少ないなら、実は相当な部分を外へ出せます。ここが多いなら、教材を作る前に、自分が何を見て判断しているのかを言葉にするところから始めます。"},{"title":"診断シートのうち、今日見る三つ","raw":"概要欄のLINEに置いてある診断シートには、確認する項目が十の領域に分かれて入っています。今日の動画では、その中で最初に効く三つだけを扱います。\n\n一つ目は、同じ説明をどれくらい繰り返しているか。初回の生徒に毎回同じ話をしていないか。よく来る質問をすぐ三つ挙げられるか。別々の生徒に同じ添削コメントを書いていないか。\n\n二つ目は、その説明を教材に移せるか。指導している内容を、知識、手順、判断、修正の四つに分けてみます。知識と手順は共通の教材にしやすい。判断と修正は、その人を見ないと決まりません。\n\n三つ目は、その人を見ないと決められない判断が、具体的に何なのか。生徒によって言うことを変えている、その基準を言葉にできるかどうかです。ここが、先生本人の時間を残す候補になります。\n\n一度、直近のレッスンを思い出してみてください。説明したこと、質問されたこと、添削したこと。それを三つに仕分けるだけで、今日の後半の話がだいぶ具体的に聞こえるようになります。"},{"title":"PART1の判定","raw":"ここまでの結果で、進み方が分かれます。\n\n同じ説明を繰り返す回数がそもそも少ないなら、教材化を急がなくていいです。ほかに手があります。\n\n同じ説明は多いけれど、生徒ごとに変える判断も同じくらい多いなら、教材を作る前に、判断の基準を言葉にする作業から始めます。ここを飛ばすと、教材を作っても「で、私の場合は？」が全部残ります。\n\n同じ説明が多くて、しかも答えが共通しているなら、そこが最初に外へ出す場所です。今日の七ステップが、そのまま使えます。\n\n上限の位置と、最初に外へ出す候補が見えました。ここから、実際に形にしていきます。\n\n判断の基準は、最初に決めておきます。先生の作業時間が減ったかどうかだけでは見ません。先生が同じ説明から離れたあとも、生徒が学習を続けられているか。この二つが同時に成立して初めて、うまくいったと言います。片方だけなら、負担を先生から生徒へ移しただけになります。教材のリンクだけ渡されて、何を見ればいいか分からないまま一週間放置されている生徒。あの状態を作ってしまったら、先生の時間が減っていても失敗です。\n\n---"},{"title":"PART2　個別レッスンだけの状態から抜ける、七つのステップ","raw":"ここから七つの手順を順番に通します。架空教室の先生にも、各ステップで一緒に動いてもらいます。"},{"title":"STEP1　毎回繰り返している説明を、全部書き出す","raw":"最初は、書き出す作業です。地味に見えるんですけど、ここで出てきた一覧が、このあとのステップ全部の材料になります。毎回十五分話している説明が一つ見つかるだけでも、月に二十回繰り返していれば五時間です。最初に探すのは、その五時間の候補です。\n\n最初に、やらないでほしいことを言います。\n\nこの段階でカメラを置かないでください。\n\n仕組み化しようと決めた人が最初にやることは、だいたい決まっています。機材を買って、基礎講座を十本撮ろうとします。そして、この始め方は途中で止まりやすいです。\n\n止まり方も似ています。まず、何を撮ればいいか決まらない。とりあえず基礎から撮ろうとすると、一本が四十分になる。四十分の動画は編集がしんどい。二本目を撮るころには、一本目の説明が下手だったことに気づいて撮り直したくなる。そうこうしているうちに三週間経って、教材は一本もできていないのに、レッスンは今週も普通にある。\n\n止まる原因は、作る順番にあります。何を教材にするか決まる前に、撮影や制作から始めてしまうからです。"},{"title":"先に、生徒に約束している結果を一文にする","raw":"書き出す前に、一つだけ決めます。この教室に通うと、生徒は最終的にどうなるのか。それを一文にしてください。\n\nピアノを初めて習う大人が、三か月で一曲を最後まで通して弾けるようになる。英会話なら、海外旅行で必要なやり取りを、自分から切り出せるようになる。そのくらいの粒度で構いません。\n\nなぜ先にこれを決めるかというと、繰り返している説明を全部教材にするわけではないからです。よく聞かれるけれど、約束した結果には関係のない話、というのは必ずあります。それまで教材にすると、本数だけ増えて、生徒はどれを見ればいいか分からなくなります。約束した結果に必要なものだけを選ぶ。そのための基準として、先に一文を決めます。"},{"title":"書き出す","raw":"そのうえで、直近一か月のレッスンを思い出して、複数の生徒に繰り返し説明したことを全部書き出します。\n\nたとえば、初回に必ず説明していること。毎回のように出る質問。初心者がほぼ全員つまずくポイント。レッスン前に準備してほしいこと。提出物の形式。よくある失敗と、その直し方。あとは、別々の生徒に同じ修正を何度も伝えている部分ですね。ここが意外と多いです。\n\nこの一覧が、教材の候補になります。\n\n拾うのは、自分が教えたい内容ではなくて、実際に何度も口にしている内容です。ここは自覚しにくいところで、先生としてはどうしても立派なカリキュラムを組みたくなります。体系立っていて、抜けがなくて、順番も美しいやつです。でも最初に仕組みへ移すべきなのは、今週も来週も同じように発生する作業のほうです。\n\n一時間のレッスンのうち、最初の二十分で毎回同じ基礎説明をしているなら、その二十分は本当に生放送で話す必要があるのか、を疑ってみてください。\n\nピアノ教室なら、初回の椅子の高さと手の形。英会話なら、予習のやり方と、レッスン中に日本語を使っていい場面のルール。書道なら、道具の手入れと練習用紙の使い方。どれも重要な内容です。重要だからこそ全員に伝えている。でも、重要であることと、先生が月に二十回口で繰り返す必要があることは、別です。\n\n生徒ごとに伝え方を変えている、という方は、実際のレッスンを一度分解してみてください。分解すると、全員に共通している説明と、その人に合わせて変えている判断が、はっきり別のものとして出てきます。最初から七対三、みたいな比率を決める必要はありません。境目がどこかを見つけるのが目的です。\n\nあわせて、直近一か月に使った時間も記録しておいてください。レッスン本体だけでなく、準備、チャット、添削、日程調整まで含めます。あとで本当に時間が減ったかを比べるとき、この記録がないと比較できません。\n\n個別の枠は残します。外すのは毎回同じ説明だけで、何を個別に残すかは後半で決めます。"},{"title":"直近一週間から、最初に変えるものを決める","raw":"ここは、頭の中だけでやらないでください。記憶でやると、印象の強い出来事だけが残って、実際に多いものが抜けます。\n\n直近一週間のレッスン記録、LINE、メール、提出物への返信を開いてください。生徒から来た質問と、自分が説明した内容を、一件ずつ短く書き出します。\n\n言葉が違っても、答えている中身が同じなら一つにまとめます。たとえば「何から練習すればいいですか」「順番が分かりません」「教材が多くて迷います」。この三つは、言い方は違いますが、全部「学習の順番が分からない」という同じ質問です。まとめると一つになります。\n\n書き出したら、それぞれに三つの数字を付けます。\n\n一週間で何回発生したか。一回の対応に何分使ったか。そして、答えないと生徒が完全に止まるかどうか。三つ目は数字じゃないので、止まる、止まらない、の二択で構いません。\n\n回数が多くて、時間も長くて、答えないと止まるもの。これが最優先です。"},{"title":"教材にする価値があるかを、時間で確かめる","raw":"ここで、その説明を教材にする価値があるかを計算します。目的は単純で、二時間かけて作った教材が、月に三分しか節約しないという事態を避けるためです。\n\n計算はこうです。その説明が一か月に何回発生するかに、一回あたりの対応時間を掛けます。\n\n週に五回、毎回十五分の説明があるとします。月を四週として、五かける四で月二十回。二十回かける十五分で、三百分。時間に直すと五時間です。\n\nその説明を、二時間で教材にできるとします。作るのに二時間使って、月に五時間戻ってくる。だとすれば、最初の一か月で作った分を取り戻せる計算になります。その後の修正や保守が少なければ、二か月目以降も時間の削減効果が残ります。\n\n反対に、月に一回、三分だけ聞かれる質問はどうでしょう。月に三分しか節約できないものを、二時間かけて動画にする理由はありません。その場で答えたほうが早い。これは教材にしない、と決めていいです。"},{"title":"STEP1の完了条件","raw":"このステップの完了条件は、立派なカリキュラムができていることではありません。\n\n書き出した項目に、さっきの三つの数字が付いていて、優先したい順に五件並んだ一覧ができていること。それだけです。紙一枚で終わります。\n\nこの五件が、最初に外へ出す候補になります。"},{"title":"架空教室の一週間","raw":"さっきの架空教室に登場してもらいます。先生が一人、生徒が二十四人、レッスン以外の対応に週九時間かかっている教室でした。\n\nこの先生は、いきなり教材を作りませんでした。まず一週間、その九時間の中身を記録しました。\n\n出てきた内訳がこうです。基礎説明が二時間半。よくある質問への返信が一時間半。提出物の確認が三時間。日程変更などの連絡が二時間。合わせて九時間です。\n\nここで初めて、忙しさが一つの塊ではなくなりました。「なんとなく週九時間持っていかれている」から、「基礎説明に二時間半、提出確認に三時間」に変わった。この時点で、どこを触ればどれだけ返ってくるかが見えます。\n\n次にこの先生がやるのは、この九時間のうち、どこまでを共通の説明として外へ出せるかを決めることです。\n\n---"},{"title":"STEP2　共通説明と個別判断を分けて、最初の教材を一つ作る","raw":"書き出したものを、ここで二つに分けます。この分け方が今日の話の中心です。うまく分かれると、何十本もの教材案を考えなくても、最初に作るべき一本がかなり自然に決まります。\n\n優先順位の付いた五件が手元にあります。ここから、実際に一つ目の教材を作ります。\n\nただ、完成された動画講座を作ろうとしないでください。最初は、一つの質問に一つの教材で十分です。五分の動画でも、パソコンの画面を録画したものでも、なんなら文章一枚でもいいんです。生徒がつまずいた瞬間にそれを見て、次に何をするか分かるなら、教材として成立しています。\n\nここを作品として作り始めると、制作そのものが新しい仕事になります。レッスンで週九時間使っていた人が、教材制作で週十時間使うようになったら、何も解決していません。\n\n教材の価値は、映像がきれいかどうかでは決まらないと思っています。先生がいない時間に、生徒が一歩進めるかどうかです。\n\nそれと、最初から百点を目指さないこと。実際の生徒に使ってもらう。どこで止まったかを聞く。足りない説明を足す。要らない部分を削る。この順番で育てます。机の上で完璧に仕上げてから出す方法は、時間がかかるうえに、たいてい生徒が実際につまずく場所を外します。\n\nここまで聞くと、「動画にしたら価値が下がるんじゃないか」と感じた方がいると思います。下がる教材はあります。一時間のレッスンをそのまま録画して置いただけなら、価値は下がりやすいです。生徒からすれば、自分のために話してくれていた一時間が、他人のために話された一時間になるわけですから。\n\nただ、何度も聞き返せる。自分の都合のいい時間に進められる。レッスンの前に予習しておける。質問を整理した状態で先生に会える。こういう設計なら、個別より便利になる部分もあります。決めるべきは、動画に何を任せて、個別で何をやるかという配分です。"},{"title":"教材の形は、質問の性質で決める","raw":"形式から決めないでください。役割から決めます。\n\n決まった手順を伝えるものなら、画面の録画や短い実演が向いています。良い悪いの判断基準を伝えるものなら、良い例と悪い例を並べて見せるのが一番早い。準備物やルールなら、文章一枚かチェックリストで足ります。毎回話している背景知識なら、音声だけでも成立します。全部を動画に統一する必要はありません。\n\nそして、一つの教材には一つの問いだけ入れます。見終わったあと、次にやることが一つ決まっている状態にする。"},{"title":"使える教材かを確かめる三つの条件","raw":"作った教材が機能しているかどうかは、次で確認します。\n\nまず、それを必要としている生徒が、迷わずそこへたどり着けること。置き場所の話です。次に、見終わったあとに何をすればいいかが分かること。最後に、同じ質問が以前より減ること。\n\n三つ目だけを見ていると原因が分からなくなるので、一つ目と二つ目を先に確認します。あとで詳しく話しますが、教材が使われない原因の多くは、内容ではなく置き場所です。"},{"title":"作らないほうがいい教材","raw":"逆に、教材にしないほうがいいものもあります。四つ挙げますが、最初の一つが圧倒的に多いです。\n\n一番多いのは、生徒ごとに答えが大きく変わるものです。「私の演奏はどこを直せばいいですか」に共通の答えはありません。これを無理に教材化すると、抽象的で誰にも当てはまらない動画ができます。\n\n二つ目は、ほとんど発生しない例外。年に一回来るかどうかの質問に、教材はいりません。\n\n三つ目は、答えを先に渡すと本人が考えなくなる課題です。自分で試行錯誤する過程そのものが学習になっている部分は、あえて残します。\n\n四つ目は、安全や大きな損失に関わって、一般化すると危ない判断です。これは後半のPART3でもう一度触れます。\n\nこの四つは、個別に残します。"},{"title":"三人に使ってもらって、止まった場所だけ直す","raw":"教材ができたら、三人くらいに使ってもらいます。三人という数に根拠があるわけではなくて、少人数のほうが一人ずつ話を聞けるからです。\n\n見るのは、どこで止まったか。同じ質問がまた来たか。見ずに質問してきた人は、なぜ見なかったか。\n\n内容と一緒に、見つけやすさと、使うタイミングも確認します。案内のタイミングや、自分に必要な部分の見つけやすさを直すだけで使われることもあります。\n\n全部を撮り直す前に、止まった箇所だけ直します。"},{"title":"僕が最初に外へ出したもの","raw":"僕の場合、毎回話していたのは、DAWという音楽制作ソフトの基本操作、作業を速くするショートカット、曲を最後まで形にするまでの順番、ミキシングとマスタリングの基礎、それからコード進行の作り方でした。\n\n教室全般に置き換えるなら、初回に必ず説明する基礎知識、道具の使い方、提出のやり方、準備の順番、よくある失敗、というあたりに対応します。内容は業種で全然違いますが、相手を見なくても答えが変わらない部分がある、という点は共通しているはずです。\n\nこの共通説明を、当時の僕は個別レッスンの枠の中で毎回話していました。ここが、最初に切り出した部分です。"},{"title":"僕が個別に残したもの","raw":"反対に、今も僕が直接見ているのは、本人が作った曲へのフィードバックです。\n\nただ、曲だけを聴いて、一般論として良い悪いを言っているわけではありません。必ず参考曲を出してもらいます。あなたが目指している完成形はこれです、という一曲です。そのうえで、そのゴールと、今提出された曲との差を見る。\n\n同じ曲でも、目指している場所が違えば、次に直すべき場所は変わります。あえて音を粗く、こもらせた質感を狙っている人に、音が濁っていますと言っても意味がない。狙って濁らせているわけですから。だから、ゴールを先に共有してもらう必要がある。\n\n僕が個別に残したのは、本人のゴールと現在地を見比べて、次にどこを埋めるかを選ぶ仕事です。フィードバックという形の中でも、この診断の部分は自分で続けています。\n\nこれは音楽以外でも同じだと思います。英会話なら、目標にしている会話と今の会話力の差を見る。デザインなら、案件の目的と作ったものの差を見る。身体指導なら、目指す状態と今の身体の差を見る。共通の知識はあらかじめまとめて渡せる。でも、その人が今どこにいて、次に何をやるかは、相手を見ないと決められません。"},{"title":"教材を作ったのに、質問が減らないとき","raw":"ここは少し丁寧に話します。教材化したのに忙しさが変わらない、という現象はかなりよく起きるからです。\n\n原因を情報量だと考えて、もっと詳しく作ろうとする方が多いんですけど、情報を増やすほど見られなくなることもあります。\n\n生徒が質問してくるとき、その人が困っているのは、知識がないことだけではありません。だいたい三つが混ざっています。\n\n一番多いのは、自分が今どの状態なのか分かっていないケースです。次に、どの教材を見ればいいのか分からないケース。そして、教材は見たけれど、その内容を自分の状況にどう当てはめればいいか分からないケース。\n\nだから、同じ説明を録画しただけでは、最後の「で、自分の場合はどうすればいいですか」が丸ごと残ります。ここに気づかないと、教材を増やしても質問は減らないままです。"},{"title":"四つの役割を、全部動画に押し込まない","raw":"そこで、役割を分けます。\n\n教材は、全員に同じ土台を渡す役です。誰が見ても同じことが分かる状態を作ります。\n\nチェックリストは、生徒が自分の現在地を自分で整理するための道具です。今どこにいるのか分からない、という一つ目の困りごとに効きます。\n\n全員が見られる質問の場は、ほかの人がどこで迷って、どう抜けたかを見る場所です。自分の状況に当てはめられない、という三つ目に効きます。他人の事例を見ると、自分の位置が分かることがあるんです。\n\nそして個別のフィードバックは、その人の状態を実際に見て、次の一手を決める役です。\n\nたとえば、「提出物のどこが悪いですか」という質問に、一般論の動画を一時間返しても、その人はたぶん動けません。一方で、提出前に確認する項目を五つ渡して、それでも残った一点だけを個別に見る。こうすると、先生が使う時間は短くなるのに、回答は薄くなりません。\n\n個別に見てもらえたという感覚は、接触時間の長さだけでは決まらないと思います。自分の状態をちゃんと見てもらえた。自分では選べなかった次の一手が決まった。そこがあるかどうかです。\n\n僕自身も、ここはかなり慎重に線を引いています。全員へ同じ説明をする時間は削っても、提出されたものを見てどこから直すかを決める部分は残す。逆にそこまで教材に置き換えようとすると、僕が提供している教育の中身そのものが薄くなります。\n\n一度、考えてみてください。あなたの生徒が直接あなたに聞きたいのは、情報でしょうか。それとも、その情報の中から自分は何を選ぶべきか、という判断でしょうか。後者なら、情報のほうは先に渡してしまえます。判断だけを個別に残せます。"},{"title":"教材が使われないとき、内容を増やす前に見ること","raw":"さっきは、質問が減らない理由を生徒の側から見ました。今度は、教材が見られない理由を、渡し方の側から見ます。\n\n教材を渡した。でも見られていない。時間をかけて作ったのに、また同じ質問が来る。これはけっこう心が折れます。\n\nそして、もっと詳しく作ろう、もっときれいに編集しよう、と考えます。でもその前に、原因を四つに分けてください。\n\n一番多いのは、存在を知らないケースです。渡したつもりでも、生徒の側では「そんなものあったっけ」になっている。これは案内の問題です。\n\nその次に多いのが、いつ見るものか分かっていないケース。教材は見つけられるけれど、今週の自分に関係あるのか判断できない。これはタイミングの問題です。\n\n三つ目は、見たけれど、そのあと何をすればいいか決まっていないケース。教材の作り方の問題です。\n\n四つ目は、見たけれど本当に答えが載っていなかったケース。内容の問題は、実はこれだけです。\n\nたとえば、入会時に教材の一覧を三十本まとめて渡したとします。先生から見れば、必要なものは全部そろっている。でも生徒から見ると、今週どれを見ればいいのか分かりません。三十本は、親切ではなく壁になります。\n\nだから、全部見てくださいと渡すのではなく、「最初の提出の前に、この一本だけ見てください」と置く。教材の一覧ではなく、その行動の直前に置く。これだけで使われ方が変わることがあります。\n\n次に、教材の終わり方を確認してください。説明して終わっていないか。見たあと何を提出するのか、何をチェックするのか、どこまでできたら次に進んでいいのか。行動が一つに決まっているか。\n\n教えたいことが多いほど、最後に課題を三つも四つも置きたくなります。最初は一つでいいです。今日やることが明確な教材は、短くても使われます。情報が豊富でも、次の一歩が曖昧なら、保存されて終わります。\n\nそれから、教材を見たはずなのに同じ質問が来たとき。「動画で話しました」と返すのは、できれば避けてください。聞くのはこの三つです。どこまで見たか。何を試したか。どこから分からなくなったか。\n\nもし複数の人が毎回同じ場所で止まっているなら、そこが教材の欠けです。人によって止まる場所がバラバラなら、共通教材の問題ではなくて、個別の判断が必要な場所かもしれません。この違いを見ないまま教材を足し続けると、本数だけが増えます。情報は増えたのに生徒は探せない、先生もどれを案内したか分からない、という状態になります。教材が増えるほど、案内の仕事が増えるんです。"},{"title":"新しい教材を足す条件","raw":"だから、追加する条件も決めておきます。\n\n同じ場所で複数人が止まった。既存の教材に答えが載っていない。一度作れば今後も繰り返し使う。この三つがそろったときだけ作ります。\n\n一人だけの特殊な質問なら、その場で個別に答えたほうが早いです。全部を一度作れば使い回せる形にする必要はなくて、使い回す価値があるものだけを見分ければ足ります。"},{"title":"架空教室が、最初に外へ出した二つ","raw":"架空教室の先生に戻ります。週九時間の内訳が見えたところでした。\n\nまず、提出のやり方。これは二十四人全員にほぼ同じ説明をしていました。画面を録画して三分の動画にしました。\n\n次に、練習の順番。これは基本の形は共通ですが、最後の詰めは本人の状態で変わります。だから、共通している基本の部分だけをチェックリスト一枚に書き出しました。全部は出しません。\n\nそして、提出物を見て次に直す場所を決める仕事。これはそのまま個別に残しました。\n\n全部を教材にもせず、全部を個別にも残さない。この境目が引けたので、次は教材、質問、個別対応をそれぞれどこへ置くかを決められます。\n\n---"},{"title":"STEP3　教材、公開の質問場所、グループ、個別の役割を分ける","raw":"教材が一つできると、次に出てくるのが、「じゃあ、見たあとの質問はどこで受けるのか」という問題です。ここを曖昧にすると、せっかく教材を作っても、個別チャットに質問が全部戻ってきます。\n\nこのSTEPでは、今、先生一人が何役を引き受けているかを見て、役割ごとに置き場所を決めます。ここまでできると、先生がその場にいない時間にも、過去の回答やほかの生徒のやり取りが学習を進めてくれるようになります。\n\n生徒から質問が来れば答える。基礎の説明が必要になれば話す。全員が同じところでつまずいても、一人ずつ説明する。作品を見て次を決めるところまで、個別レッスンだけで教えていると全部を先生一人が担当することになります。\n\nでも、この四つは本来、別の場所が担当できます。"},{"title":"四つの置き場","raw":"一つ目が、教材です。共通する知識、基礎、手順、準備、よくある失敗を担当します。これは「毎回同じことを話している」という困りごとを解決します。\n\n二つ目が、グループでの指導です。複数の生徒に共通する課題を、まとめて扱います。一人の質問への回答を、ほかの人も同時に学べる形にできるのが強みです。これは「同じ説明を人数分繰り返している」という困りごとに効きます。\n\n三つ目が、全員が見られる場所、コミュニティや公開の質問チャンネルです。ここは後回しにされやすいんですが、一度答えた内容をその人だけで終わらせないために使えます。質問を残したり、ほかの生徒の事例を見られるようにしたり、進み具合を共有する場所です。\n\n四つ目が、個別対応です。その人固有の診断、添削、方向修正、例外への対応。ここだけは、先生が見ないと決まりません。\n\nこの四つを同じ比率で入れる必要はありません。教室によって配分は変わります。ただ、個別レッスンだけで運営していると、教材やグループ、公開の場で受け持てる仕事まで、先生一人が引き受けることになります。まずは仕事ごとに置き場所を分けます。"},{"title":"具体的にどう分かれるか","raw":"たとえば、こうなります。\n\n初回の説明と基礎は教材に移す。全員がつまずくテーマは、週一回のグループの回で扱う。過去の質問と事例は、全員が見られる場所に残す。そのうえで、一人ひとりの診断と方向修正だけを個別にする。\n\nこの分け方がうまく回れば、個別に使う時間は減らせるかもしれません。ただ、本当に減ったかどうかは、教材の更新やチャット対応まで含めた、先生が使った全部の時間で確認します。個別枠が減っても、裏側の作業が増えていたら意味がないので。\n\n個別の枠数は減るかもしれません。ただ、そこで外すのは、毎回同じ説明を繰り返していた時間です。空いた時間を、その人にしかできない判断へ回せれば、同じ二十分でも中身が変わります。\n\n僕が運営してきた音楽制作の教育でも、考え方は同じでした。全員に必要な基礎を毎回一対一で話すのをやめて、共通部分は教材として持ってもらう。質問と学習の記録は、全員が見られる場所に残す。複数人に共通する課題は、ほかの人も学べる形で扱う。そして、その人の作品を見ないとできないフィードバックは個別に残す。現在は、累計七十名以上の受講生全員へ、同じ長さの個別レッスンを配る形にはしていません。"},{"title":"場を作ることと、使われることは別","raw":"ただし、この四つを用意すれば自動的にうまくいく、という話ではありません。\n\nコミュニティを作ったけれど誰も投稿しない。グループの回を始めたけれど、実際には一人ずつ順番に個別指導しているだけになっている。教材を作ったけれど誰も見ていない。これは全部、実際に起こります。\n\n場を用意することと、実際に使われることは別なので、分けて確認します。教材をいつ見るのか。質問をどこでするのか。提出物をいつ出すのか。どの状態になったら個別対応に進むのか。ここまで決めて、初めて仕組みとして動きます。\n\nイメージしやすいように、一つの回し方を例に出します。\n\n月の頭に、その月のテーマ教材を渡す。水曜の夜に六十分のグループの回を開いて、共通の課題を扱う。質問は思いついたときにコミュニティへ出してもらって、先生は一日一回まとめて返す。そして月に一回、二十分だけ個別の診断枠を取る。\n\n個別レッスンを週一回やっている教室と比べれば、個別の枠は明らかに減っています。一方で、生徒が学びに触れる回数は減っていません。教材でも学べるし、ほかの人の質問からも学べるし、グループで直接聞けるし、必要なときは個別でも見てもらえる。\n\nただ、先生と接する回数が多ければ満足してもらえるとは限りません。教材を見た人の数、質問の数、提出した人の数を実際に確認して、使われているかどうかを見ます。"},{"title":"どこへ置くかを決める、二つの軸","raw":"何をどこに置くか迷ったら、二つの質問で決めます。\n\n一つ目。その答えは全員共通か、生徒ごとに変わるか。\n\n二つ目。その問題に、本人が自分で気づけるか。それとも外から見ないと気づけないか。\n\n答えが共通で、本人も問題に気づけるなら、教材に置きます。自分で気づけるから、自分で探して見に行けます。\n\n答えは共通だけれど、本人が理解不足に気づきにくいなら、グループで扱います。ほかの人の質問や反応を見ることで、自分にも同じ穴があると気づけるからです。ここは教材だと届きません。困っている自覚がないので、そもそも見に行かないんです。\n\n答えが生徒ごとに変わっても、ほかの人の事例から学べる性質のものなら、全員が見られる場所や、共有するフィードバックの形で扱えます。\n\nそして、本人固有の事情が強くて、ほかの事例では判断できないものだけを個別に残します。\n\n英語で例を出すと分かりやすいです。過去形の作り方というルールは、教材です。誰に対しても答えが同じで、本人も「過去形が分からない」と自覚できます。一方、会話中に自分が過去形を落としていることに気づく練習は、グループのほうが向いています。落としている本人には自覚がないので、ほかの人が指摘される場面を見て初めて気づく。発音の癖は、その人固有ですが、共有のフィードバックでもほかの人の学びになります。そして、仕事上の機密を含む商談の練習は、個別に残したほうがいい。\n\n今提供している内容を、この二つの軸で全部仕分けてみてください。"},{"title":"公開の質問場所を、質問置き場で終わらせない","raw":"質問を全員が見られる場所へ移すと、それだけで仕組みができたように見えます。でも、チャットに回答が流れていくだけだと、あとから誰も探せません。同じ質問が、少し言い方を変えてまた来ます。\n\nここを、次の人も使える形にするには、三つ足します。\n\nまず、質問の題名。「うまくできません」という題名では、三か月後には誰も見つけられません。「初心者が提出前に確認する三項目」のように、状況と目的が分かる題名に付け替えます。\n\n次に、どんな人に関係する話かを書きます。「初回提出の方」「練習を始めて二週間以内の方」といった一行です。これがあると、読んだ人が自分に関係あるかどうかを一秒で判断できます。\n\n最後に、回答のあと何をするかを置きます。「確認したうえで、AとBのどちらだったかを書いて提出してください」というような一文です。これがあると、一人への回答が、次の人の学習手順の中に組み込まれます。\n\nただし、個人情報や、その人だけの事情はそのまま公開しないでください。公開するのは、ほかの人にも役立つ問題の構造と、判断の中身です。本人の事情は外す。必要なら許可を取る。ここを雑にやると、誰も質問しない教室になります。一度そうなると戻すのは大変です。\n\n公開の場では、誰が質問したかよりも、どこで迷って、どう抜けたのかをみんなで見られる形にします。\n\n回答が次の教材になる状態は、かなり価値があると思っています。先生は、生徒の実際のつまずきから教材を更新できる。生徒は、自分だけが分かっていないわけではないと知れる。まだ質問していない人も、先に答えに触れられる。一つの回答が三方向に効きます。\n\n回答が増えすぎたら、月に一度だけ整理します。重なっているものをまとめる。古くなったものを直す。基礎教材に格上げしたほうがいいものを選ぶ。毎回きれいに編集する必要はなくて、最初は題名とタグを付けるだけで十分です。回答した瞬間に終わらせない、という一点だけ守れば足ります。"},{"title":"僕が実際にやっていること","raw":"僕はDiscordという、グループで使えるチャットツールに質問用のチャンネルを作っています。質問も回答も、受講生全員が見られます。すでに説明した動画があれば、返信でその動画のリンクを貼ります。一人に答えて終わりではなくて、まだ質問していない人も先に読めるし、同じ場所で止まった人は、僕に聞く前に答えへたどり着けます。\n\nフィードバックの依頼も、全体から見える場所に提出してもらっています。\n\nこれは効率の話だけではなくて、提出そのものの質にも影響しました。人が見る場所に出すとなると、出す前に自分で教材を確認するし、中途半端な状態では出さない。僕の教室では、実際そうなりました。\n\n返したフィードバックも動画で残ります。本人は何度でも見返せるし、ほかの受講生も、別の人がどこでつまずいて、僕が何を見て判断したかを学べます。\n\n週一回一時間の授業だと、その時間が終わればいったん切れます。でも、教材と動画のフィードバックが残っていれば、必要なときに戻れる。半年後に次の曲を作るとき、前のフィードバックを見直すこともできます。\n\n個別の時間を減らすと、学べる量まで減るように思うじゃないですか。僕が運営してきた範囲では、そうはなりませんでした。必要なものに、必要なタイミングで何度でも戻れる状態にしたほうが、学ぶ側が触れる回数は増えます。"},{"title":"「生徒は自分に習いたい」という反論","raw":"ここまで聞くと、「生徒は教材を見たいんじゃなくて、自分に習いたくて来ているんだ」と感じた方がいると思います。これは、その通りだと思います。だから、先生を教材に置き換えるという発想では、たぶんうまくいきません。\n\nただ、生徒があなたに求めているものを、一つの塊として扱わないほうがいいです。分けると、こうなります。\n\n先生の言葉で基礎を理解したい。自分の状態を見てほしい。迷ったときに質問したい。続けられるように見守っていてほしい。同じ「先生に習いたい」の中に、性質の違う四つが入っています。\n\n基礎の説明は、先生本人の声と考え方で教材にできます。誰かの汎用教材を買ってきて配るのとは違います。ほかの生徒への回答は、先生の判断が見える公開の場に残せます。自分への方向修正は、個別に残す。見守りは、進捗の共有と接点の設計でカバーできる。\n\n教材にも先生の考え方は残せますし、直接話す時間は個別の判断へ使えます。生徒との接点を、目的に合わせて分ける感覚です。\n\nそして、答えだけを並べた教材より、先生が何を見てどう判断したかまで入っている教材のほうが、その先生から学んでいるという感覚は残ります。何を試して何が起きたか。どこで判断を外したか。なぜその判断をしたか。それは教材の中にも残せます。むしろ、毎回同じ説明に追われているときより、言葉を選べます。\n\nただし、何でも長く話せばいいわけではありません。生徒が行動するために必要な背景は残す。今の課題に関係のない知識は、別のところへ分ける。この線引きは要ります。"},{"title":"架空教室が、質問の置き場を変えた","raw":"架空教室の先生は、個別のLINEへ来ていた質問を、全部公開することにはしませんでした。\n\nほかの生徒にも役立つ質問だけを選んで、個人が特定できる情報を外し、題名と「どんな人に関係するか」を付けて残しました。その人固有の事情は、これまで通り個別のやり取りに残しています。\n\nここまでで、何をどこへ置くかは決まりました。ただ、置き場所が決まっただけでは生徒は動きません。次は、先生がいないときでも生徒が次の一歩を判断できる、学習の順番を作ります。\n\n---"},{"title":"STEP4　先生がいなくても、生徒が次に何をすべきか分かる状態を作る","raw":"部品が揃ったら、次は生徒から見た順番をつなぎます。教材を作ったのに使われない教室は、内容が悪いとは限りません。入会したあと、最初に何を見て、何をやって、どこへ提出するのかがつながっていないだけ、ということがかなりあります。\n\n想像してみてください。生徒が入会した日、その人が最初に見る画面は何でしょうか。\n\n多くの教室では、教材の一覧です。動画が三十本並んでいて、コミュニティへの招待リンクがあって、自己紹介を書いてくださいと書いてあって、初回レッスンの日程を予約するリンクもある。\n\n先生から見れば、必要なものが全部そろった、親切な状態です。生徒から見ると、どこから触ればいいか分からない状態です。そして、分からないと人は止まります。その日は「あとでゆっくり見よう」と思ってタブを閉じて、三日経って、なんとなく気まずくなって、一週間経つ。\n\nここで生徒が止まるなら、教材の中身より先に、案内の順番を見直します。"},{"title":"決めるべき流れ","raw":"だから、順番を決めます。最初に何を見るのか。見たあとに何をするのか。どこへ提出するのか。どの基準を満たしたら次へ進んでいいのか。分からないときはどこで質問するのか。そして、どの質問を全体で扱って、どの質問を個別で扱うのか。\n\nたとえば、こういう形です。課題の提出が来たら四十八時間以内に返す。その間、生徒は待っているだけにせず、次の教材へ進んでおく。フィードバックを受けたら、同じ課題を一度だけやり直して再提出する。同じ場所で二回続けて止まったら、個別で見る。\n\n回数や期限の数字は、あなたの教室に合わせて変えてください。ただ、こういう形で決まっていると、生徒は先生からの次の指示を待たずに動けます。\n\n提出の場所を作っただけでは足りません。出したあと、いつ、何が返ってくるのか。返ってきたあと何をするのか。待っている時間に何をしておくのか。そこまで決めます。\n\n先生が毎回「次はこれをやってください」と個別に送らないと進まないなら、まだ先生が案内係をやっている状態です。"},{"title":"何でも自動化しない","raw":"一方で、ここで全部を自動にしようとすると失敗します。\n\n質問への回答を全部テンプレートにする。添削を全部AIに任せる。何でもグループだけで解決させる。ここまでやると、その教室ならではの価値が薄れます。\n\n案内や、繰り返しの作業は、自動化しやすい部分です。先生の診断と方向修正は残す。そこを残すから、市販の動画講座や安い教材との差が出ます。"},{"title":"入会後の七日間を先に作る","raw":"長いカリキュラムを作る前に、最初の七日を作ってください。ここが一番、離脱が起きます。\n\n初日は、最初にやることを一つだけ案内します。教材を全部見て、コミュニティを見て、自己紹介を書いて、日程を予約して、を一度に出すと、始める前に止まります。一つに絞ります。\n\n二日目は、その一つができたかを確認します。\n\n三日目か四日目に、小さな提出を一つ入れます。完成品でなくていいです。今の状態が分かるもので構いません。英会話なら三十秒の音声。トレーニングなら一日分の記録。経営の相談なら、今の売上の内訳を書いた紙一枚。\n\n五日目に、最初のフィードバックを返します。ここで直す点を十個出さないでください。次に変える一点だけを返します。十個返すと、生徒はどれからやるか決められずに止まります。\n\n七日目に、始める前と何が変わったかを、本人の言葉にしてもらいます。\n\n最初の成果体験は、大きな結果である必要はありません。何をすればいいか分かった。自分の問題が一つ特定できた。初めて提出できた。この感覚があると、次の一週間に進めます。\n\n初週で止まる原因は、たいてい三つです。入会直後に選択肢が多すぎる。最初の課題で完璧を求めてしまう。そして一週間経っても、自分が進んだ実感が持てない。教材を増やす前に、この三つを潰します。"},{"title":"僕がやっている案内の順番","raw":"僕は、動画教材を置いて「好きなものから見てください」にはしていません。見る順番を全部組んであります。\n\n入会した直後に見るのは、まず案内の動画です。そこで僕から挨拶をして、どこから始めて、次に何を見るかを案内します。先生との関係を作る、全体像を見せる、最初の行動を一つ決める。この順番です。\n\nフィードバックの提出方法も、長い説明文ではなくて、実際の画面を見せた動画にしました。文章で「ここにアップロードしてください」と書くより、画面を映して手を動かして見せたほうが、質問が減ります。\n\nそして僕の場合は、本人のデモ音源と参考曲を、決めた方法でアップロードしてもらいます。そのうえで、今どういう完成形を目指しているのか、自分ではどこに課題を感じているのかも書いてもらう。\n\nこれを先にそろえてもらうことで、僕が判断するときに見比べるものが最初から手元にそろっている状態を作りました。曲が届いてから「何を目指していますか」「参考曲はありますか」と確認する必要がなく、届いた時点で比較と診断から始められます。\n\n回答にはLoomというツールを使っています。自分の画面と声を録画して、そのままリンクで渡せるツールです。ただ、Loomを入れたから楽になったわけではありません。必要な情報がそろって届く提出のルールを先に作ったから、Loomで二十分から三十分にまとめて返せるようになりました。\n\nツールは最後です。先に、先生が判断するために何を出してもらうかを決めます。"},{"title":"架空教室は、教材一覧を作らなかった","raw":"架空教室の先生は、作った三分の動画とチェックリストを、教材一覧のページに置いて終わりにはしませんでした。\n\n初回提出の直前に、「最初の一回だけ、これを見てください」という形で置きました。そして動画の最後には、見終わったあとに何を提出するかを一つだけ書きました。\n\n教材を増やすことよりも、生徒が次に何をするか決まっている状態を先に作りました。\n\nここまで来ると、どこまでを一つの商品として約束して、どの期間で変化を作るかを決められます。\n\nこの四つのステップが回り始めると、先生がレッスン中でなくても、生徒が教材を見て進み、過去の公開Q&Aから答えを見つけられる場面が出てきます。一度答えた内容が、その場にいなかった別の生徒にも届く。ここまで来て初めて、先生の時間を増やさずに、教えられる量を増やせるようになります。\n\n---"},{"title":"STEP5　変化の期間と、提供する範囲を商品にする","raw":"ここから、売上の形にも関わる話に入ります。時間を一枠ずつ売る形から、一定期間でどこまで進めるかを売る形へ変えられるか。売上が予約表の枠数だけで決まる状態から抜けられるかどうかは、ここで決まります。\n\n生徒が動く流れができました。次は、それを商品の形にまとめます。\n\n個別レッスン型では、一回六十分、一回九十分という時間に値段が付いています。これをそのままオンラインへ持っていくと、Zoomで同じことをするだけになります。場所は変わっても、時間を切り売りしている構造は変わりません。\n\nここまで作った教材、質問できる場所、個別の診断を、一定期間の学習環境としてまとめます。これが新しい商品の形になります。\n\n決めるのは、こういうことです。三か月で何をできるようにするのか。そのためにどの教材を使うのか。グループでは何を扱うのか。質問はどこまでできるのか。個別の対応は何回あって、何のために使うのか。\n\nこれを、まず少人数へ試すための一つのプランとしてまとめます。"},{"title":"価格を決める前に、原価を出す","raw":"価格の決め方の全部は別の動画に分けますが、この段階で必ずやってほしいことが一つあります。原価を出すことです。\n\nなぜ原価を出すかというと、安く売りすぎて自分の首を絞めるのを防ぐためです。ここを飛ばすと、募集の直前に「今の個別レッスンが四万円だから、半額の二万円くらいかな」という決め方になります。そして人数が集まった瞬間に、時給が千円を割ります。しかも、一度出した価格は下げるより上げるほうが難しい。だから先に計算します。\n\n原価というのは、生徒を一人教えるために、自分がいくら分のコストを使うかという金額です。順番に出します。\n\nまず、その期間中に使う時間を全部足します。教材を作る時間、個別対応の時間、グループを運営する時間、質問に返信する時間、事務や運営の時間。全部です。\n\n次に、自分の一時間をいくらとして考えるかを決めます。ここは自分で決めていい数字です。決めたら、その金額をさっきの合計時間に掛けます。\n\nそこへ、人にお願いした費用と、使っているツールの月額を足します。\n\n最後に、その合計を、受け入れる予定の人数で割ります。これが、生徒一人あたりにかかる費用です。\n\n価格は、まずこの金額を下回っていないかを確認します。下回っていたら、教えるほど赤字です。\n\n一つ注意があります。最初の募集では、教材を作った時間も全部この費用に入れてください。ただし、その教材を次の募集でも使えるなら、二回目以降は毎回ゼロから作る時間はかかりません。だから、最初に一度だけかかる教材制作の分と、募集のたびに必ず発生する個別対応や質問返信の分は、分けて考えます。二回目以降は、原価がぐっと下がるはずです。\n\nそのうえで、今の個別プランと比べて、生徒にとって何が増えて何が減るのかを説明できる価格にします。"},{"title":"時間を減らしたのに、値段を保っていいのか","raw":"ここで、罪悪感が出てくる方がいます。自分の作業時間は減ったのに、同じ金額をもらっていいのか。もっと言うと、値上げしていいのか。\n\n気持ちは分かります。ただ、生徒が求めているのは、先生が何時間働いたかより、自分がちゃんと前へ進めるかどうかです。\n\n先生が十時間働いたから十万円、二時間しか働いていないから二万円、という値付けにはなりません。先生が使う時間を短くしても、生徒が同じくらい、あるいはそれ以上に学習を続けられる形を作って、実際の結果でそれを確認できたなら、その教え方そのものに価値があります。教材と場所と判断を組み合わせて作った環境は、先生が一時間しゃべることの代わりではなくて、別のものです。\n\nただし、条件があります。先生の作業時間を減らした結果、生徒の学習が止まるなら、それはサービスを減らしただけです。生徒の進みが悪くなれば、続けてくれる人も、紹介も減ります。だから移行したあとは、先生の時間だけでなく、生徒がちゃんと提出できているか、課題を進められているかも必ず確認します。この確認のやり方は、STEP7でまとめて話します。"},{"title":"組み合わせの例","raw":"具体例を一つ出します。\n\n毎週一回の個別レッスンを、月四万円で販売していたとします。これを単純に「動画講座二万円」に置き換える、という話ではありません。\n\n教材と、週一回のグループの回と、質問できる場所と、月一回の個別診断を組み合わせて、三か月で提供する内容を決めます。すると、先生が一対一で対応する時間は減っても、生徒が学べる機会は減らずに済みます。\n\nそして、個別レッスンそのものは、希望する人がいるかどうかと、時間と費用に見合うかを確かめたうえで、本当に個別が必要な人向けの別プランとして残せます。なくす必要はありません。\n\n僕の場合の価格の決め方も、結局は個人的な事情の積み重ねでした。自分が確保できる時間、当時の生徒層、そのときの残り体力。原価を下回っていないか、そして自分が無理なく続けられるか。まずはその二つを確認してください。\n\n架空教室の先生も、この段階ではすぐに価格を決めませんでした。まず、最初の動画とチェックリストを作る時間、毎週の質問返信、提出物の確認、運営に使う時間を全部足します。最初の一か月だけかかる制作時間と、その後も毎月かかる対応時間を分けておくと、初回の試作にいくら必要で、通常運営では一人あたりどれくらいかかるのかが見えてきます。その数字を出してから、受け入れる人数と価格を考えます。\n\n提供する内容と、生徒が使う流れが決まったら、次は今いる生徒をどう移すかです。\n\n---"},{"title":"STEP6　今いる生徒を、一気に移行させない","raw":"新しい形ができると、早く全員を移したくなります。でも、今の売上と信頼を守りながら変えるには、ここが一番気を遣うところです。僕も、教材を作ることより、今いる生徒へどう伝えるかのほうを長く考えました。\n\nこのステップは飛ばさないでください。ここでの失敗は、教材が微妙だったときの失敗より、はるかに痛いです。一方で、順番を守れば、今の関係を壊さずに新しい形を試せます。"},{"title":"悪い伝え方と、良い伝え方","raw":"まず、絶対に避けたい伝え方から。\n\n「来月から個別レッスンをやめて、動画とグループに切り替えます」\n\n先生側からすれば、改善です。教材が増えて、質問もできるようになって、生徒にとっても良くなるはず。でも、この一文を受け取った生徒に見えているのは、自分が毎月払っている個別レッスンが、来月からなくなるという事実だけです。\n\n今いる生徒は、現在の教え方を前提にお金を払っています。最初は、今の形を急に置き換えず、追加として試してもらうほうが伝わりやすいです。\n\nたとえば、こう言い換えます。\n\n「来月から、レッスンの前にこの十分の動画だけ、先に見ておいてもらえますか。基礎の説明をそこに任せられるので、レッスンの六十分はまるごと、あなたの曲のことに使えます」\n\n言っている内容はほとんど同じです。基礎説明を動画に移す、という話です。でも後者は、生徒にとっての取り分が増える話として届きます。減らす話ではなく、密度を上げる話になっている。\n\n同じように、よくある質問をまとめた場所を作る。希望者だけのグループの回を試してみる。個別レッスンの一部を、提出とフィードバックに置き換えてみる。こういう形で、小さく使ってもらいます。\n\nそのうえで、反応を見ます。何が便利だったか。何が分かりにくかったか。個別の時間は本当に減ったか。生徒は以前より準備して来るようになったか。ここを確認してから、新しいプランとして募集します。"},{"title":"移行の四つの選び方","raw":"今いる生徒の扱いには、大きく四つの選び方があります。\n\n一つ目は、旧プランをそのまま残して、新規の人だけ新しい形にする方法。反発が一番小さいです。今いる人には何も起きませんから。ただし、旧プランにかかる仕事時間はしばらく残ります。二重運営になる期間が長い、という代償があります。\n\n二つ目は、今いる生徒に、希望制で新しいプランを提案する方法。移りたい人だけ移ります。反応も見られるので、検証としては使いやすいです。\n\n三つ目は、一定期間、二つのプランを併存させる方法。二つ目に近いですが、期限を切っている点が違います。\n\n四つ目は、期限を決めて旧プランを終了し、新プラン一本にまとめる方法。一番早く一本化できます。ただしその分、今いる生徒全員に新しいプランの内容を理解してもらう必要があるし、離れる人も出ます。\n\nどれを選ぶかは、今の契約期間、生徒との関係の深さ、先生の時間がどれくらい切迫しているかで決まります。時間が本当にもう限界なら四つ目を選ばざるを得ないこともありますし、まだ余裕があるなら一つ目から試せます。"},{"title":"伝える順番","raw":"どれを選んでも、伝える順番は同じです。\n\n最初に、今の形で起きている問題を、生徒にとっての不便として説明します。「先生が忙しいので」ではなくて、「今の形だと、レッスンの最初の二十分が毎回基礎説明で埋まってしまう」「返信が翌週になることがある」といった形です。\n\n次に、新しい形で増えるものを示します。いつでも見返せる教材がある。レッスン外でも質問できる。ほかの人の質問からも学べる。自分がどこまで進んだか分かる。そして個別の時間を、自分固有の問題だけに使える。\n\nそのあとで、減るものと変わるものを隠さず伝えます。個別の回数が減る。返信の時間が決まる。一部がグループになる。ここを曖昧にすると、後から不信につながります。\n\n最後に、移行日と選べる選択肢を出します。"},{"title":"「前のままがいい」と言われたら","raw":"必ず出てきます。そのときに、仕組み化のほうが正しいと押し切らないでください。\n\nまず、前の形の何が必要なのかを聞きます。理由はだいたい三つに分かれます。\n\n先生と直接話す時間そのものに安心感があるのか。実際に個別で見てもらう必要が本当にあるのか。それとも、新しい使い方が分からなくて不安なだけなのか。\n\n三つ目が、実はけっこう多いです。この場合は、最初の一か月だけ使い方を個別に案内すれば解決します。一つ目なら、旧プランを人数限定の上位プランとして残す。二つ目なら、新しいプランに個別診断を追加する形で対応できます。\n\n理由を聞かずに一律の答えを返すと、本当は残せた人まで離れます。\n\n移行の間も、今いる生徒の学習が止まらないことを最優先にしてください。"},{"title":"僕の移行方法を、そのまま勧めない理由","raw":"僕の場合は、旧サービスを終了することを配信で伝えて、そのあと新しいサービスを大きく案内しました。かなり思い切った形です。\n\nただ、これができたのは条件がそろっていたからです。僕にはもともと店舗がなくて、個別レッスン自体もオンラインでした。発信活動をしていたので、配信で案内できる接点もありました。固定の曜日に通ってくる生徒がいて、保護者がいて、場所の賃貸契約があって、地域での関係がある店舗型の教室とは、前提が全然違います。\n\n店舗型の方に、はっきり言っておきます。店舗をやめる必要はありません。\n\n店舗レッスンを残したまま、外へ出せるものはあります。レッスン前の共通説明。宿題の出し方。よくある質問。振替になったときに家で進める内容。これを外へ出すと、店舗で先生と会う時間を、その場でしかできない観察と、実技と、方向修正に集中させられます。むしろ店舗型のほうが、対面の価値がはっきりしている分、外へ出す判断はしやすいかもしれません。\n\n共通の説明と個別の判断を分けるという考え方は使えても、今いる生徒の移し方まで同じにはなりません。僕は店舗の運営をしたことがないので、そこは正直に言っておきます。オンラインの教室で、自分一人ではこれ以上受け入れられない状態になって教え方を変えた当事者として話しています。"},{"title":"架空教室は、二人から始めた","raw":"架空教室の先生は、二十四人全員に「来月から変えます」とは言いませんでした。\n\nまず二人に、提出方法の動画とチェックリストを、一週間だけ使ってもらいました。これまでの個別判断は、そのまま残したままです。\n\n結果、一人は問題なく使えました。もう一人は、動画を見たはずなのに、同じ質問をしてきました。\n\n聞いてみると、動画は見ていました。ただ、チェックリストのどの項目が初回の自分に当てはまるのか判断できなかったんです。\n\nそこで先生は、リストの先頭に「初回の人は、この三つだけ確認してください」と一行足しました。それで解決しました。\n\n大きく作り直す前に、置き場所の修正で足りることがある。この一件は、そういう例です。\n\n次は、この小さな変更を続けるか、直すか、止めるかを判定します。\n\n---"},{"title":"STEP7　少人数で試して、続ける・直す・止めるを判定する","raw":"最後は、全部を一気に切り替えず、少人数で試します。ここまで作ったものが本当に先生の時間を空け、生徒も前へ進めるのか。それを、小さく確かめます。うまくいかなかったときに元へ戻れる余地を残したまま始められるので、完成を待ち続ける必要もありません。\n\nここが一番、心理的に難しいところなので、丁寧に話します。"},{"title":"なぜ、判定基準を先に決めるのか","raw":"判定の基準は、試し始める前に決めてください。理由は単純で、作った本人には、あとから止める判断ができないからです。\n\n考えてみてください。教材を作るのに二十時間使いました。生徒にも「新しい形にします」と説明しました。ここで「やっぱり戻します」と言うのは、失敗を認めることに見えます。人間なので、そう見えることを避けたくなる。\n\nだから、うまくいっていない数字が出ても、「まだ様子を見よう」「もう少し教材を足せば」と考えます。そして三か月経つ。\n\nこれを防ぐには、感情が入る前に基準を決めておくしかありません。\n\n決めるのは三つです。\n\n続けるのは、先生の繰り返し作業の時間が減って、なおかつ生徒の進み具合が悪くなっていないとき。\n\n直すのは、先生の時間は減ったけれど一部の生徒が止まったとき。あるいは、生徒は進んでいるけれど、教材の修正や更新に使う時間が増えて、結局トータルで減っていないとき。\n\n止めるのは、質問しにくくなったとき、提出が明らかに減ったとき、個別に残すべき判断まで消してしまったときです。\n\n止めることは、仕組み化の否定ではありません。共通で渡せる範囲と、個別に残す範囲の線引きが一つ分かった、という結果です。たとえば、基礎説明は教材へ移せた。でも、月一回の方向確認までグループにしたら、迷う生徒が増えた。だったら、方向確認だけ個別へ戻す。全部を元に戻す必要はなくて、問題が起きた線引きだけを戻します。\n\n営業しながら店を改装する場合と同じです。壁を全部壊してから考えるのではなく、一か所だけ変えて、お客さんの動きがどう変わるかを見る。戻せる範囲で試す、ということです。\n\nだから、最初から全生徒を移行させない。最初から年間契約にしない。最初から教材を百本作らない。どれも、後から戻せる状態を残すためです。\n\n小さく試せるなら、早く始めたほうがいいです。二人で試せるなら二人で始めて、一週間で分かることは一週間で見る。全部を一度に変えないのは、慎重になって動かないためではなく、問題が出た場所だけをすぐ直せるようにするためです。"},{"title":"変える前の数字を、必ず残す","raw":"少人数で試すときに一番多い失敗は、変えたあとに、変える前がどうだったか分からなくなることです。\n\n教材を作った。質問の場所を変えた。グループで答えるようにした。なんとなく楽になった気はする。でも、本当に時間が減ったのか、生徒が前より迷っていないのか、比べられない。\n\nだから、変える前の一週間を記録します。難しい管理表はいりません。\n\n記録するのは、対応した件数、使った時間、同じ質問が来た回数、返信までにかかった時間、そして生徒が次の提出まで進んだ割合。この五つのうち、無理なく取れるものを三つで十分です。\n\nたとえば、質問が十二件、返信に合計二時間、同じ質問が四件あった。これが変更前の数字です。\n\n教材を入れた翌週、質問は八件、返信は一時間二十分、同じ質問は一件になった。ここだけ見ると、改善しています。\n\nでも、その週に生徒の提出が遅れていたなら、まだ成功とは言えません。"},{"title":"質問が減ったことと、迷いが減ったことは別","raw":"ここは、この動画でいちばん注意してほしいところです。\n\n先生側の対応件数が減ったことと、生徒側の迷いが減ったことは、同じではありません。\n\n質問しづらいルールを作れば、数字は簡単に下がります。「質問は水曜のみ受け付けます」「まず教材を確認してから質問してください」といったルールは、運営としては合理的ですが、生徒からすると聞くハードルが上がります。困っているけれど聞かない生徒が増えても、先生の手元の数字は「質問が減った」としか出ません。\n\nだから、生徒側に問題が起きていないかを見る数字を、別に一つ持ちます。課題を提出した人の割合、課題を終えた人の割合、同じ内容をもう一度質問した人の数、あるいは短い満足確認。このどれか一つで構いません。\n\n僕なら、最初に少人数で試すときは、「前より進めやすかったか」「どこで止まったか」を短く聞きます。満足度を十段階で聞くだけだと、優しい生徒は高い数字を付けてくれます。それは嬉しいんですけど、直す材料にはならない。具体的にどこで手が止まったかを聞いたほうが、次に何を直すか決まります。\n\n見ているのは、教材の出来ではなくて、次の行動まで一人で進めたかどうかです。教材を最後まで見ても何も提出できていなければ、教育としては途中です。逆に、半分しか見ていなくても、必要な部分を使って次の課題に取り組めたなら、その教材は役割を果たしています。再生完了率だけで教材を評価しないでください。教室の教材は、作品としての出来ではなく、生徒が次の行動に移るための道具として見ます。"},{"title":"作る側の時間も、回収できるか計算する","raw":"もう一つ、作る側の時間も記録します。ここも数字にします。\n\n三分の動画を作るのに、台本を書いて、撮影して、編集して、五時間かかったとします。五時間は、分に直すと三百分です。\n\nその動画によって、毎週十分ずつ仕事が減るとします。三百分を、毎週十分ずつ取り戻していくので、元が取れるまで三十週かかる計算です。半年以上ですね。\n\nそれでも、何年も使える基礎教材なら作る意味はあります。三十週で回収したあとは、ずっと得ですから。でも、来月には内容が変わる案内なら、五時間かけて動画にする必要はありません。文章一枚で足ります。\n\nだから、形式は三つで選びます。長く使うものか。説明に動きが必要か。文章より誤解が減るか。\n\n画面の操作は動画が向いています。提出前の確認はチェックリスト。一問一答は、よくある質問集としてまとめる。判断が人によって揺れるもの、その揺れ自体が学びになるものは、公開の質問場所が向いています。\n\n形式から決めず、役割から決めてください。"},{"title":"僕は、全教材を完成させてから始めていない","raw":"僕の話をします。\n\n新しいサービスを始めるときに確かめる必要があったのは、個別レッスンをやめられるかどうかではありませんでした。オンライン主体の新しい学び方に、本当に人が集まるのか。教材と、公開の質問場所と、動画のフィードバックという形に、参加したいと思ってもらえるのか。そっちです。\n\nだから、教材を全部完成させてから募集した、ということはありません。\n\n最初に作ったのは、学習を始めるために絶対に必要な、大きな柱だけです。感覚で言うと、残りの六割から七割の教材は、受講生がもう最初の教材で学び始めているあいだに、少しずつ足していきました。新しい教材を入れたら「教材を更新しました」と案内する。その繰り返しです。\n\n全部完成するまで待っていたら、いつ始められるか分かりません。そもそも、その教材を本当に欲しい人がいるかどうかも、出すまで分からないので。"},{"title":"最初の募集で、何が起きたか","raw":"その最初の募集で入ってくれたのは、十人弱でした。\n\n想定していたのは二十人くらいです。LINEの登録者は三百人台いたので、その中から二十人なら届くだろうと考えていました。結果は、その想定を下回りました。\n\n一方で、入ってくれた方の満足度は高いと感じていました。ここは数値で比べた結果ではなく、運営していた僕の体感です。\n\nそこで僕が考えたのは、この渡し方そのものが求められていないのではなくて、誰の何が変わるサービスなのかという説明と、知ってから申し込むまでの流れのほうに、直すところがあるんじゃないか、ということでした。\n\nここは分けて見ないと、判断を間違えます。売れなかったからといって、提供方法が悪いとは限らない。逆に、満足度が高いからといって、市場があると証明されたわけでもない。入口の話と、入会後の中身の話は、別々に評価します。"},{"title":"回数無制限を、無制約にしない","raw":"フィードバックは、回数だけで言えば無制限だと伝えています。ただ、何でもいつでも投げていいわけではありません。条件を付けています。\n\nまず、数小節の断片ではなく、必ずワンコーラスまで完成させてから出すこと。次に、一つのフィードバックが終わってから次の曲を提出すること。そして、前回伝えた内容を、次の曲で実行してくること。返却は原則一週間以内です。\n\n回数で制限をかけるのではなくて、完成と実践を次の提出の条件にしている、という設計です。\n\nこれで実際どうなっているかというと、今は約六十名いますが、一週間に来る依頼は平均で六件ほどです。一件二十分から三十分なので、週に二時間から三時間になります。\n\n全員に同じ頻度で時間を配るのをやめて、成果物が完成して、僕の判断が必要になったときだけ入る形にしたからです。\n\n無制限と伝えると、いつでも出せる安心感が生まれる一方で、月に何回と決めた場合より提出頻度が落ち着く面もありました。僕の場合はそれに加えて、曲を一つ完成させるという条件が、自然な区切りになっています。\n\n僕がやっているのは、生徒側の安心感は回数を無制限にすることで作って、運営が回るかどうかは提出条件、順番、返却期限、人数の上限のほうで調整する、という分け方です。この二つを混ぜないほうが、どちらも決めやすくなります。"},{"title":"七日目、十五日目、三十日目に確認する","raw":"毎日の細かい進め方は教室によって変わりますが、最初に少人数で試すときは、三つの時点だけ見れば足ります。\n\n七日目は、使い方が伝わったかどうか。教材を開いたか、提出できたか、質問する場所を間違えていないか。ここで詰まっているなら、内容ではなく案内の問題です。\n\n十五日目は、生徒の学習が止まっていないか。ここで、個別に見るべき人と、共通の案内を直せば解決する人を分けます。\n\n三十日目は、先生が実際に使った時間と、生徒が課題に取り組めているかを一緒に見ます。片方だけが良くても、そのまま人数は増やしません。"},{"title":"数字を見る周期を分ける","raw":"数字は、種類ごとに見る周期を変えます。毎日全部を見るのは、意味がないだけでなく、判断を悪くします。\n\n毎日見るのは、未対応のものと、重大な停止だけです。売上や継続率を毎日見ても、少人数では動きに意味がありません。\n\n毎週見るのは、教材が使われたか、課題が提出されたか、どんな質問が来たか、先生が何時間使ったか。これは運営を直す材料になります。\n\n毎月見るのは、売上、必要な費用を引いたあとに残る金額、継続した人数、やめた理由、生徒一人あたりに何時間使ったか。これはサービス全体を変えるかどうかの判断に使います。\n\n今日のログイン数で価格を変えない。一人の質問でカリキュラム全体を変えない。一か月試しただけで年間計画まで決めない。数字を見る頻度と、実際に中身を変える頻度は、分けて考えます。"},{"title":"生徒の成果も一緒に見る","raw":"教え方を変えれば、生徒が前より進みにくくなる可能性もあります。だから少人数で試して、教材を見たか、課題を提出したか、学習が進んだか、続けたいと思っているかを確認します。先生の作業時間が減っても、生徒が課題に取り組めなくなったら失敗です。\n\n共通の説明を先に見てもらい、一対一の時間をその人に必要な判断へ使うことで、前より学びやすくなることもあります。結果は試す前には決められないので、変更前の数字を残して比べます。"},{"title":"架空教室の三十日後","raw":"架空教室に戻ります。三十日経ちました。\n\n先生の対応時間は、週九時間から八時間十五分になりました。四十五分の減少です。\n\n正直、少ないと感じるかもしれません。二十四人を教えていて、一か月動いて、週四十五分。\n\nここで判定を分けるのが、この四十五分を維持するのに何時間かかるか、です。一度作った動画とチェックリストが、次に入る生徒にもそのまま使えて、修正や更新に月十分しかかからないなら、これは続けていい変更です。人数が増えるほど差が広がっていくからです。生徒が四十八人になったとき、この四十五分は九十分になり得ます。\n\n逆に、この四十五分を減らすために毎週二時間の更新作業が必要なら、失敗です。時間の総量は増えています。\n\nそして最後に、三つを一枚で見ます。\n\n一つ目。生徒一人から受け取る金額から、教材を作る費用と普段の対応にかかる費用を引いても、残るかどうか。\n\n二つ目。先生が使った合計時間を受講人数で割って、生徒一人あたり何時間かかっているかを出す。そのうえで、生徒が一人増えるたびに先生の時間も同じだけ増えていく状態に戻っていないかを見ます。ここが元に戻っていたら、教え方は変わっていません。\n\n三つ目。提出する人が減っていないか。同じ質問が増えていないか。生徒が次の課題へ進めているか。\n\nこの三つが同時に成立したときだけ、次の少人数へ広げます。一つでも欠けているなら、広げる前に直します。\n\nこれで七つのステップは完了です。共通の説明を教材や公開の場へ移して、先生の時間はその人を見ないとできない診断と方向修正へ集中させる。そのうえで、生徒の進み方が落ちていないかを数字で確認する。オープニングで話したことを、実際に確かめられる形にしたのが、この七ステップです。\n\n---"},{"title":"PART3　教室によって、共通にできる範囲がどう変わるか","raw":"七ステップの考え方は、業種が変わってもかなりそのまま使えます。ただ、線を引く位置は変わります。ここでは、特に注意が必要な二つの領域に絞って話します。\n\n一つ目は、身体と安全が関わる教室です。トレーニング、ヨガ、武道、あるいは楽器でも身体の使い方を扱う場合が該当します。\n\nフォーム、痛みの有無、負荷の設定、補助が必要かどうかの判断。共通の知識は動画で渡せます。関節の動く仕組みとか、基本のフォームの説明とか、そこは教材のほうが繰り返し見られる分むしろ有利です。ただ、本人の状態を見ずに負荷を上げると、怪我につながります。だから、共通説明を外へ出せば出すほど、個別の安全確認は明確に残します。ここを削ると、時間は減っても事故のリスクが上がります。効率化してはいけない部分です。\n\n二つ目は、子どもと保護者の契約がある教室です。\n\nここが構造として難しいのは、学ぶ本人と、お金を払う人と、日々の学習を支える人が違うからです。子どもが学ぶ順番だけを組んでも、家で保護者が何を確認すればいいのか分からなければ、練習は続きません。逆に言うと、保護者向けの案内こそ毎回同じことを説明しているはずなので、そこは教材にしやすい領域でもあります。子ども向けの学習順と、保護者向けの案内を、別々に設計してください。\n\n知識を教える教室、作品を添削する教室、身体を扱う教室で、外へ出せる量はそれぞれ違います。全部を同じ形にそろえる必要はありません。共通の説明を教材へ移して、その人を見ないとできない判断を個別に残す。この考え方は同じで、教室ごとに変わるのは、どこまでを共通にして、どこから個別にするかという線の位置だけです。\n\nこの線が引けると、空いた時間を何に使うかも選べます。新しい生徒を受け入れてもいいし、土日の枠を減らしてもいい。教材を良くする時間に使ってもいい。僕の場合は、現在の個別フィードバックが週平均六件、合計二時間から三時間なので、それ以外の時間を教材や運営の改善へ回せています。大事なのは、空いた時間を必ず売上に替えることではなく、同じ説明の繰り返しに時間の使い道を決められない状態から抜けることです。\n\n---"},{"title":"PART4　新しい教え方を、一枚にまとめる","raw":"ここで、紙を一枚出してください。埋めるのは四つだけです。\n\n一つ目。誰を対象にするか。\n\n二つ目。一定の期間で、何ができる状態まで連れていくか。\n\n三つ目。自分に残す個別の判断は何か。\n\n四つ目。予定している最大の人数まで増えたとき、先生は一週間に何時間使うことになるか。\n\nデザインの教室を例に、実際に埋めてみます。\n\n対象は、仕事でバナーを作ったことはあるけれど、これでいいのか自分では判断できない人。\n\n三か月で、自分で構成を決めて、制作して、なぜその修正をしたのかを説明できる状態を目指す。\n\n全員に共通する考え方、制作の手順、提出前の確認項目は、教材へ移す。本人が受けている案件の目的、クライアントから求められていること、納期や予算といった条件を踏まえた方向の判断は、個別に残す。\n\nそして四つ目。十人受け入れたとき、週に何件の添削が来て、一件に何分かかるか。仮に週五件で一件三十分なら、添削だけで週二時間半です。そこにグループの回と、質問の返信と、教材の更新が乗ります。この合計が、自分が出せる時間を超えていたら、人数を増やす前に設計を直します。\n\nこの四つが同時に成立しないなら、まだ人数を増やす段階ではありません。\n\nここまで来ると、自分の教室について三つ答えられるはずです。今週、何を一つ外へ出すか。何を個別に残すか。何を測って、続けるか止めるかを決めるか。\n\n答えが出た方は、そのまま小さく試してください。\n\n---"},{"title":"PART5　自分で決められることと、外から見たほうがいいこと","raw":"ここまで、現状の確認、七つの手順、業種ごとの違い、試したあとの判定まで話しました。今の教え方で売れる金額の上限。同じ説明の見つけ方。教材の作り方。グループと公開の場の使い方。個別に残す判断。原価の出し方。今いる生徒の移し方。少人数で試したあとの確認方法。やることは、ほぼ全部話したつもりです。\n\nでは、この通りに全部入れればいいのか。そうはなりません。\n\n最後に決める必要があるのは、何をやらないかです。\n\nたとえば、全員にチャット無制限を付けない。最初から教材を百本作らない。個別診断が必要ない人にまで個別枠を付けない。先生が毎日コミュニティを盛り上げに行かない。今いる生徒を一度に移行させない。単価を上げるためだけにサービスを足さない。\n\nこの引き算は、一般論だけでは決められません。教室ごとに、生徒がお金を払っている理由が違うからです。\n\nピアノ教室で、先生と一緒に弾く時間そのものが価値の中心なら、その時間は大きく残すべきです。そこを削ったら、商品ではなくなります。\n\n資格の講座で、共通知識をどれだけ効率よく入れるかが中心なら、教材の比率をかなり高くできます。\n\nデザインの添削で、作品ごとの判断に価値があるなら、個別フィードバックを中心に残して、それ以外を全員へ共通で渡す形にします。\n\n経営の相談で、優先順位を決めることが価値なら、知識は教材へ移して、意思決定の場だけを高い価格の個別として残します。\n\n同じ「仕組み化」という言葉でも、出てくる答えは全部違います。\n\nそして、今いる生徒がいる教室では、変更の順番も違ってきます。新しく入る人だけ新プランにするのか。今いる生徒に追加の教材として試してもらうのか。個別プランを値上げして残すのか。一定期間だけ二つを併存させるのか。既存の生徒がいる場合は、今の提供を止めずに段階的に移す必要があります。移行の順番を間違えると、教え方の話ではなく、信頼の話になってしまいます。\n\n無料の動画で渡せるのは、全体の流れと、手順と、判断するときの見方と、よくある失敗です。今日、それは全部渡しました。\n\nただ、情報を知ることと、自分の事業で決めることは別です。僕が音楽制作の教育を作ったときも、教材を作った時点では終わりませんでした。どこまでを全員へ共通で渡すと学びやすいのか。どこから個別に見ないと価値が落ちるのか。質問をどこへ残すのか。生徒に実際に使ってもらいながら、何度も直しました。\n\nだから、今日の内容を聞いて自分で決められそうなら、そのまま進めてください。それが一番早いです。\n\n一方で、やることは分かったけれど、自分の場合は何を外すのか、今いる生徒へどう移すのか、価格とサポート範囲をどう決めるのか、そこまでは判断できない、ということもあると思います。それは、外から状況を見ないと決めにくい段階です。"},{"title":"まとめ","raw":"今回扱ったのは、共通の説明と個別の判断を、同じ時間の中でまとめて提供していることが、教室の受け入れ上限を作っている、という問題でした。\n\nやることを、もう一度だけ通します。直近一週間の繰り返しを測る。共通の説明と個別の判断を分ける。共通部分を最初の教材一つへ移して、生徒が次に何をするかまで決める。質問と事例は、次の人も使える場所へ残す。今いる生徒を一気に変えず、少人数で試す。そして、先生が使った時間と、費用を引いても利益が残るかと、生徒が進めているかを一緒に確認する。\n\n今日、自分で決められそうだと思った方へ、行動は一つだけにします。\n\n直近一週間で繰り返した説明を、一つだけ保存してください。動画でも、文章でも、チェックリストでも構いません。形式は、次の生徒がそれを使って一人で次の作業まで進めるかどうかで選びます。一つで十分です。二つ作ろうとすると、たいてい両方止まります。\n\n一方で、何が共通で、どこからが個別判断なのか決めきれない。今いる生徒へどう移すか怖い。数字を出してみたけれど、最初に触る場所が分からない。そういう場合は、概要欄のLINEから診断シートを使ってください。今の教え方での売上上限、毎週戻せそうな時間、最初に外へ出す仕事、自分に残すべき個別判断を、一枚にまとめて決められるようにしています。\n\nそして現在、僕が案内しているのは、今後の検証のために教室の現状を聞かせていただく研究面談だけです。今日話した考え方と手順は、僕自身のオンライン教育では実際に使ってきました。一方で、店舗型やほかの業種では、共通にできる範囲がどこまでなのかを今まさに確かめています。研究面談では、そこを聞かせてください。完成した有料商品を売る面談ではありません。\n\nこの動画自体も、僕が毎回一対一で説明していた考え方を、先に共通で渡すための実演でした。ただ、動画を見ただけでは、あなたの教室で何を残すべきかまでは僕には決められません。そこは、あなたの生徒が何にお金を払っているかを一番よく知っている人が決めることです。\n\nこのチャンネルでは、これからも、生徒が来てくれたあとの教え方と提供の設計を扱っていきます。先生の時間だけを増やさずに、どうすれば生徒へ必要なものを渡せるのか。今日の話だけで終わらせず、業種ごとの違いや、実際に動かす時の判断まで掘り下げていくつもりです。\n\nまずは今週一時間使った反復の中から、説明を一つだけ、次の生徒も使える形へ変えてみてください。そして戻った時間を、新しい生徒、教材の改善、休む時間のどれに使うか、自分で選べる状態に変えてください。\n\nここまで見ていただいて、ありがとうございました。"}],icons={"say":"●","example":"◇","ask":"？","bridge":"→"};let index=Number(localStorage.getItem('amane-beat-index')||0);index=Math.max(0,Math.min(beats.length-1,index));const $=id=>document.getElementById(id);
function render(){const b=beats[index],p=beats[index-1],n=beats[index+1];$('sectionName').textContent=b.chapter+' / '+b.section;$('count').textContent=(index+1)+' / '+beats.length;$('progress').style.width=((index+1)/beats.length*100)+'%';$('prevpeek').textContent=p?'済：'+p.payload[0]:'';$('nextpeek').textContent=n?'次：'+n.payload[0]:'最後です';$('cue').innerHTML='<span class="icon">'+icons[b.type]+'</span>'+b.cue;$('payload').innerHTML=b.payload.map(x=>'<div>'+x+'</div>').join('');$('fixed').style.display=b.fixed.length?'block':'none';$('fixed').innerHTML='<b>ここで正確に入れる</b>'+b.fixed.map(x=>'<span>'+x+'</span>').join('');$('listener').innerHTML='<b>ここまでで聞き手に残ること</b>'+b.listener;$('nextq').textContent=b.nextQuestion?'↳ '+b.nextQuestion:'';$('detail').open=false;$('original').textContent=sections[b.sectionIndex].raw;localStorage.setItem('amane-beat-index',index)}
function move(d){index=Math.max(0,Math.min(beats.length-1,index+d));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('menu').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');$('restart').onclick=()=>{index=0;$('sheet').classList.remove('open');render()};const seen=new Set();sections.forEach((s,i)=>{if(seen.has(s.title))return;seen.add(s.title);const btn=document.createElement('button');btn.className='sectionlink';btn.textContent=s.title;btn.onclick=()=>{index=beats.findIndex(b=>b.sectionIndex===i);$('sheet').classList.remove('open');render()};$('sectionList').appendChild(btn)});addEventListener('keydown',e=>{if(e.key==='j'||e.key==='ArrowDown')move(1);if(e.key==='k'||e.key==='ArrowUp')move(-1)});let x=0;$('tapstage').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});$('tapstage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x;if(dx>70)move(-1);if(dx<-70)move(1)},{passive:true});render();
</script></body></html>
